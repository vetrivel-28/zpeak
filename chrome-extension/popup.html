<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Meeting Knowledge Assistant</title>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Logo" class="logo">
    <h2>Term Explainer</h2>
  </div>
  
  <div id="health-banner" class="banner banner-offline hidden">
    <strong>Backend Offline</strong><br>
    Please start: <code>uvicorn api.main:app --reload</code>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-target="tab-search">Search</button>
    <button class="tab-btn" data-target="tab-analyzer">Analyzer</button>
    <button class="tab-btn" data-target="tab-debug">Debug</button>
  </div>

  <!-- Search Tab -->
  <div id="tab-search" class="tab-content active">
    <div class="input-group">
      <input type="text" id="term-input" placeholder="Enter term (e.g. LangGraph)...">
      <button id="btn-explain" class="btn btn-primary">Explain</button>
    </div>
    
    <div id="search-result" class="result-container hidden">
      <!-- Search result rendered here -->
    </div>
  </div>

  <!-- Analyzer Tab -->
  <div id="tab-analyzer" class="tab-content">
    <textarea id="transcript-input" placeholder="Paste meeting transcript here..."></textarea>
    <button id="btn-analyze" class="btn btn-primary full-width">Analyze Transcript</button>
    
    <div id="analyze-loader" class="loader-container hidden">
      <div class="loader"></div>
      <p>Analyzing transcript...</p>
    </div>

    <div id="analyze-results" class="analyzer-results hidden">
      <!-- Collapsible cards rendered here -->
    </div>
  </div>

  <!-- Debug Tab -->
  <div id="tab-debug" class="tab-content">
    <div class="result-container" style="font-family: monospace; font-size: 12px; line-height: 1.6;">
      <div style="margin-bottom:8px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
        <span style="color:#94A3B8;">Platform:</span> <strong id="dbg-platform">None</strong><br>
        <span style="color:#94A3B8;">Monitor Status:</span> <strong id="dbg-status">Inactive</strong><br>
        <span style="color:#94A3B8;">Backend Status:</span> <strong id="dbg-backend">Unknown</strong><br>
      </div>
      <div style="margin-bottom:8px;">
        <span style="color:#94A3B8;">Terms Detected:</span> <strong id="dbg-terms" style="color:#5EEAD4;">0</strong><br>
        <span style="color:#94A3B8;">API Latency:</span> <strong id="dbg-latency">0ms</strong><br>
      </div>
      <div>
        <span style="color:#94A3B8;">Last Caption Snippet:</span><br>
        <div id="dbg-caption" style="background:rgba(0,0,0,0.3); padding:8px; border-radius:4px; margin-top:4px; color:#E2E8F0; min-height: 40px; word-break: break-all;">
          Waiting for captions...
        </div>
      </div>
      <button id="btn-refresh-debug" class="btn btn-primary full-width" style="margin-top: 12px;">Refresh Debug State</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
